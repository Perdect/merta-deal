plugins {
    id "com.android.application"
}

/*
 * Merta Deal for Android — a Trusted Web Activity (TWA).
 * The app opens https://mertadeal.com full screen in the user's Chrome (no address bar),
 * so login, cart, Razorpay/UPI, location and web-push notifications work exactly as on the web,
 * and every website release reaches the app instantly. Only the shell lives here.
 *
 * Change the site/host in one place: twaHost below. The site must serve
 * /.well-known/assetlinks.json listing this package and its signing certificate SHA-256
 * (see src/app/.well-known/assetlinks.json/route.ts and ANDROID.md).
 */
def twaHost = "mertadeal.com"
def launchPath = "/?source=twa"

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace "com.mertadeal.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.mertadeal.app"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0.2"

        resValue "string", "hostName", twaHost
        resValue "string", "launchUrl", "https://" + twaHost + launchPath
        resValue "string", "webManifestUrl", "https://" + twaHost + "/manifest.webmanifest"
        resValue "string", "providerAuthority", "com.mertadeal.app.fileprovider"
        resValue "string", "assetStatements", '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "web", "site": "https://' + twaHost + '" } }]'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
    implementation "com.google.androidbrowserhelper:locationdelegation:1.1.2"
}
